{% load wagtailcore_tags %}
{% if page %}
    <div class="container">
        <div class="row">
            <div class="col-12 mt-3">
                {% if value.heading %}<h2>{{ value.heading }}</h2>{% endif %}
                <ul hx-boost="true" hx-target="main" hx-select="main" hx-swap="innerHTML show:window:top">
                    {% for child_page in page.get_children.live %}
                        <li><a href="{% pageurl child_page %}">{{ child_page.title }}</a></li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
{% endif %}
