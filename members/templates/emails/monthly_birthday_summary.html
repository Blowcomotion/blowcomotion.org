<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Birthday Summary - {{ month_name }} {{ year }}</title>
</head>
<body>
<pre><b><u>BIRTHDAYS</u></b>
{% for birthday in upcoming_birthdays %}{{ birthday.member }} - {{ birthday.instruments|join:", " }} - {{ birthday.birthday|date:"F j" }}
{% endfor %}</pre>
</body>
</html>
